{% extends "blogs/base.html" %}

{% block page_header %}
  <h3 class="mb-3">Add a new post</h3>
{% endblock page_header %}    

{% block content %}
  <div class="card">
    <div class="card-body">
      <form action="{% url 'blogs:new_post' %}" method='post'>
        {% csrf_token %}

        {% for field in form %}
          <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">
              {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
              <div class="alert alert-danger mt-1">
                {{ field.errors }}
              </div>
            {% endif %}
          </div>
        {% endfor %}
        
        <button name="submit" class="btn btn-primary mt-2">add post</button>
      </form>
    </div>
  </div>    

{% endblock content %}
